<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modal</title>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
</head>
<body class="ds-body">
<main class="ds-page">
<section class="ds-var "><div class="ds-cap">Окно «Добавить событие» (форма)</div><div class="ds-stage"><div style="width:640px;max-width:none;flex:0 0 640px;"><div data-modal-card="1" style="width: 100%; max-width: 640px; max-height: 88vh; overflow: auto; padding: 28px 30px 30px; border-radius: 24px; background: rgb(255, 255, 255); box-shadow: rgba(32, 30, 29, 0.28) 0px 24px 56px; display: flex; flex-direction: column; gap: 20px;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px;">
          <span style="font-size: 26px; font-weight: 800; font-style: normal; line-height: 34px; color: rgb(53, 49, 44);">Добавить событие</span>
          <button aria-label="Закрыть" style="width: 40px; height: 40px; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; border-radius: 999px; background: rgb(241, 239, 230); cursor: pointer; font-family: Figtree, system-ui, sans-serif; font-size: 15px; color: rgb(32, 30, 29);">✕</button>
        </div>
        <form style="display: flex; flex-direction: column; gap: 16px;">
          <label style="display: flex; flex-direction: column; gap: 6px;">
            <span style="font-size: 11px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; color: rgb(153, 153, 153);">Ссылка на событие</span>
            <input type="url" placeholder="http://" value="" style="width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid rgb(217, 201, 171); border-radius: 10px; font-family: Figtree, system-ui, sans-serif; font-size: 15px; color: rgb(32, 30, 29); background: rgb(255, 255, 255);">
          </label>
          <label style="display: flex; flex-direction: column; gap: 6px;">
            <span style="font-size: 11px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; color: rgb(153, 153, 153);">Дата и время</span>
            <input type="text" placeholder="Например, 5 сентября в 17:00 или каждую субботу в 11:00" value="" style="width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid rgb(217, 201, 171); border-radius: 10px; font-family: Figtree, system-ui, sans-serif; font-size: 15px; color: rgb(32, 30, 29); background: rgb(255, 255, 255);">
          </label>
          <label style="display: flex; flex-direction: column; gap: 6px;">
            <span style="font-size: 11px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; color: rgb(153, 153, 153);">Место</span>
            <input type="text" placeholder="Студия, центр или адрес" value="" style="width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid rgb(217, 201, 171); border-radius: 10px; font-family: Figtree, system-ui, sans-serif; font-size: 15px; color: rgb(32, 30, 29); background: rgb(255, 255, 255);">
          </label>
          <label style="display: flex; flex-direction: column; gap: 6px;">
            <span style="font-size: 11px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; color: rgb(153, 153, 153);">Описание</span>
            <textarea rows="3" placeholder="Что за событие, для какого возраста, цена — всё, что знаете" style="width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid rgb(217, 201, 171); border-radius: 10px; font-family: Figtree, system-ui, sans-serif; font-size: 15px; color: rgb(32, 30, 29); background: rgb(255, 255, 255); resize: vertical;"></textarea>
          </label>
          <div style="display: flex; gap: 10px; padding-top: 4px;">
            <button type="submit" style="flex: 1 1 auto; padding: 12px 20px; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; border-radius: 999px; background: rgb(255, 96, 50); color: rgb(255, 246, 236); font-family: Figtree, system-ui, sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;">Отправить</button>
            <button type="button" style="padding: 12px 20px; border: 1px solid rgb(217, 201, 171); border-radius: 999px; background: transparent; color: rgb(79, 72, 63); font-family: Figtree, system-ui, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer;">Отмена</button>
          </div>
        </form>
      </div></div></div></section>
</main>
</body>
</html>
