<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GroupDivider</title>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
</head>
<body class="ds-body">
<main class="ds-page">
<section class="ds-var "><div class="ds-cap">Разделитель дня в ленте событий</div><div class="ds-stage"><div style="grid-column: 1 / -1;">
          <div style="display: flex; align-items: center; gap: 18px; width: 100%; padding: 12px 2px 0px;">
            <span style="font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: rgb(139, 168, 107); flex: 0 0 auto;">Пт, 25 сентября</span>
            <span style="flex: 1 1 auto; height: 1px; background: rgb(230, 230, 230);"></span>
            <span style="font-size: 14px; font-weight: 400; line-height: 20px; color: rgb(154, 154, 154); flex: 0 0 auto;">2 события</span>
          </div>
      </div></div></section>
<section class="ds-var "><div class="ds-cap">Время суток в расписании (плитка)</div><div class="ds-stage"><div style="grid-column: 1 / -1;">
          <div style="display: flex; align-items: center; gap: 18px; width: 100%; padding: 4px 2px 6px;">
            <span style="font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: rgb(139, 168, 107); flex: 0 0 auto;">Утром</span>
            <span style="flex: 1 1 auto; height: 1px; background: rgb(230, 230, 230);"></span>
            <span style="font-size: 14px; font-weight: 400; line-height: 20px; color: rgb(154, 154, 154); flex: 0 0 auto;">9 занятий</span>
          </div>
      </div></div></section>
<section class="ds-var "><div class="ds-cap">Время суток в расписании (список)</div><div class="ds-stage"><div data-list-head="1" style="display: flex; align-items: center; gap: 18px; padding: 26px 4px 12px;">
            <span style="font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: rgb(139, 168, 107); flex: 0 0 auto;">Утром</span>
            <span style="flex: 1 1 auto; height: 1px; background: rgb(230, 230, 230);"></span>
            <span style="font-size: 14px; font-weight: 400; line-height: 20px; color: rgb(154, 154, 154); flex: 0 0 auto;">9 занятий</span>
          </div></div></section>
</main>
</body>
</html>
