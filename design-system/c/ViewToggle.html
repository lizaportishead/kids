<!doctype html>
<html lang="ru">
<head>

<meta name="robots" content="noindex, nofollow, noarchive">

<title>ViewToggle</title>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">

<body class="ds-body">
<main class="ds-page">
<section class="ds-var "><div class="ds-cap">Плиткой (по умолчанию)</div><div class="ds-stage"><div role="group" aria-label="Вид карточек" style="display: inline-flex; align-items: center; gap: 2px; padding: 2px; border-radius: 999px; border: 1px solid rgb(217, 201, 171); background: transparent;">
        <button type="button" aria-label="Плиткой" title="Плиткой" aria-pressed="true" style="display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 32px; padding: 0px; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; border-radius: 999px; cursor: pointer; transition: background 120ms; background: rgb(150, 214, 62); color: rgb(32, 30, 29);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>

        </button>
      </div></div></section>
<section class="ds-var "><div class="ds-cap">Списком</div><div class="ds-stage"><div role="group" aria-label="Вид карточек" style="display: inline-flex; align-items: center; gap: 2px; padding: 2px; border-radius: 999px; border: 1px solid rgb(217, 201, 171); background: transparent;">
        <button type="button" aria-label="Плиткой" title="Плиткой" aria-pressed="false" style="display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 32px; padding: 0px; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; border-radius: 999px; cursor: pointer; transition: background 120ms; background: transparent; color: rgb(109, 99, 87);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>
        </button>
        <button type="button" aria-label="Списком" title="Списком" aria-pressed="true" style="display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 32px; padding: 0px; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; border-radius: 999px; cursor: pointer; transition: background 120ms; background: rgb(150, 214, 62); color: rgb(32, 30, 29);">
