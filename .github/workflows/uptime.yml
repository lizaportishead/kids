name: Проверка сайта

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить сайт и свежесть данных
        env:
          TG_TOKEN: ${{ secrets.TG_ALERT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_ALERT_CHAT }}
        run: |
          problems=""

          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 --max-time 20 https://klubok.kids/ || true)
          [ "$code" = "200" ] || problems="${problems}Главная klubok.kids отвечает: ${code:-нет ответа}\n"

          json=$(curl -s --retry 3 --retry-delay 10 --max-time 20 https://klubok.kids/data/events.json || true)
          upd=$(echo "$json" | grep -m1 '"updatedAt"' | sed 's/.*: *"\(.*\)".*/\1/')
          if [ -z "$upd" ]; then
            problems="${problems}events.json не читается\n"
          else
            age=$(( $(date +%s) - $(date -d "$upd" +%s) ))
            [ "$age" -lt 129600 ] || problems="${problems}Данные не обновлялись $((age/3600)) ч (последнее: $upd)\n"
          fi

          if [ -n "$problems" ]; then
            printf "🚨 Клубок:\n$problems" > msg.txt
            curl -s --max-time 20 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "text@msg.txt" > /dev/null
            cat msg.txt
            exit 1
          fi
          echo "ok"
